<div class="pt-10 px-10">
    <div class="flex gap-2">
        <button mat-icon-button [routerLink]="['..']">
            <mat-icon>arrow_back</mat-icon>
          </button>
        <h1 class="text-4xl font-light">
            <span>
                Cadastro de coleta
            </span>
        </h1>
    </div>
    <h2 class="text-gray-400 pt-5">
        Cadastro
    </h2>
    <div class="w-hull pt-3">
        <div class="bg-gray-400 w-[90%] h-[1px]"></div>
    </div>
    <form [formGroup]="form" class="grid grid-cols-1 max-w-5xl">
        <div>

            <div class="flex flex-col pt-5">
                <label>Cliente</label>
                <mat-form-field appearance="outline" class="w-full">
                    <mat-select placeholder="Selecione um cliente" [formControlName]="'clienteId'">
                        <mat-option></mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-col pt-1">
                    <label>Data da coleta</label>
                    <mat-form-field appearance="outline" class="w-full">
                        <input matInput [matDatepicker]="picker" placeholder="Selecione uma data" [formControlName]="'dataColeta'">
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </div>
    
                <div class="flex flex-col pt-1">
                    <label>Quantidade Estimada (KG)</label>
                    <mat-form-field appearance="outline" class="w-full">
                        <input 
                        matInput 
                        placeholder="Digite a quantidade" 
                        class="w-full"
                        [formControlName]="'quantidade'">
                    </mat-form-field>
                </div>
            </div>
            
        </div>

        <button
            type="submit"
            class="bg-blue-400 rounded-lg h-11 hover:bg-blue-600 hover:text-white duration-300 hover:cursor-pointer">
            Salvar feedback
        </button>
    </form>
</div>
