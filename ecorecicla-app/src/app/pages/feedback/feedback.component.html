<div class="flex flex-col items-center justify-start min-h-screen bg-[#06467a] px-6 pt-12 pb-6">
  <!-- Logo -->
  <div class="mb-4">
    <img src="images/Logo.png" alt="Logo Eco Recicla" class="h-20 object-contain drop-shadow-md" />
  </div>

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-8 mt-2">
    <!-- Título -->
    <h1 class="text-2xl sm:text-3xl font-semibold text-center text-gray-800 mb-4">
      Feedback do Cliente
    </h1>

    <!-- Linha separadora -->
    <div class="w-full border-t border-gray-200 mb-6"></div>

    <!-- Formulário -->
    <form [formGroup]="form" class="flex flex-col gap-6">
      
      <!-- Nota -->
      <div class="flex flex-col gap-2">
        <label class="text-gray-700 font-medium">Nota para o serviço</label>
        <mat-slider min="1" max="6" step="0.5" showTickMarks discrete [displayWith]="formatLabel">
          <input matSliderThumb />
        </mat-slider>
      </div>

      <!-- Status da coleta -->
      <div class="flex flex-col gap-2">
        <label class="text-gray-700 font-medium">Status da coleta</label>
        <mat-form-field appearance="outline" class="w-full">
          <mat-select formControlName="statusColeta" placeholder="Selecione um status">
            <mat-option value="realizada">Realizada</mat-option>
            <mat-option value="atrasada">Atrasada</mat-option>
            <mat-option value="nao_realizada">Não realizada</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Comentário -->
      <div class="flex flex-col gap-2">
        <label class="text-gray-700 font-medium">Comentário do cliente</label>
        <mat-form-field appearance="outline" class="w-full">
          <textarea matInput rows="4" placeholder="Deixe seu comentário" formControlName="comentario"></textarea>
        </mat-form-field>
      </div>

      <!-- Botão -->
      <button type="submit"
        class="w-full text-white font-medium py-3 rounded-lg hover:bg-[#053961] transition-all bg-[#06467a] cursor-pointer">
        Salvar feedback
      </button>
    </form>
  </div>
</div>
